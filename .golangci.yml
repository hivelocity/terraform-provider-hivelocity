version: "2"

run:
  timeout: 5m

linters:
  default: standard
  settings:
    errcheck:
      # d.Set errors on primitive attributes are not actionable; complex
      # attributes go through setResourceData which checks them.
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
  exclusions:
    paths:
      - hivelocity-client-go
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - hivelocity-client-go
